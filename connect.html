<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071523">
  <title>Choose How to Connect | SolvenHub</title>
  <meta name="description" content="Choose how to connect with SolvenHub: visit our website, chat on WhatsApp, or follow us on Instagram.">
  <link rel="canonical" href="https://www.solvenhub.com/connect.html">
  <link rel="icon" href="assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --navy: #071523;
      --blue: #0B5C93;
      --blue-light: #2E9BD8;
      --green: #159B55;
      --paper: #F4F8FB;
      --ink: #0D2A42;
      --muted: #617487;
      --line: #DFE9F1;
      --shadow: 0 22px 64px rgba(5, 28, 48, .18);
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--navy); }
    body {
      margin: 0; min-height: 100vh; min-height: 100svh; padding: 26px 16px;
      display: grid; place-items: center;
      font-family: "DM Sans", Arial, sans-serif;
      background:
        radial-gradient(ellipse at 12% 8%, rgba(46,155,216,.26), transparent 36%),
        radial-gradient(ellipse at 90% 92%, rgba(21,155,85,.13), transparent 34%),
        linear-gradient(145deg, #071523 0%, #0B2E49 58%, #071B2B 100%);
      color: var(--ink);
    }
    .card {
      width: min(100%, 510px); padding: 34px 28px 26px;
      border: 1px solid rgba(255,255,255,.72); border-radius: 26px;
      background: rgba(255,255,255,.98); box-shadow: var(--shadow);
      text-align: center;
    }
    .logo {
      display: block; width: min(100%, 290px); max-height: 92px;
      object-fit: contain; margin: 0 auto 26px;
    }
    .eyebrow {
      margin: 0 0 9px; color: var(--blue); font-size: 11px;
      font-weight: 800; letter-spacing: .18em; text-transform: uppercase;
    }
    h1 {
      margin: 0; color: var(--navy);
      font: 800 clamp(27px, 7vw, 35px)/1.15 "Manrope", Arial, sans-serif;
      letter-spacing: -.04em;
    }
    .intro {
      margin: 12px auto 27px; max-width: 340px;
      color: var(--muted); font-size: 15px; line-height: 1.55;
    }
    .options { display: grid; gap: 13px; }
    .option {
      display: flex; align-items: center; gap: 14px;
      min-height: 72px; padding: 13px 17px; border-radius: 14px;
      color: #fff; text-align: left; text-decoration: none;
      box-shadow: 0 8px 20px rgba(8,34,56,.12);
      transition: transform .16s ease, box-shadow .16s ease, filter .16s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .option:hover { transform: translateY(-2px); filter: brightness(1.06); box-shadow: 0 12px 25px rgba(8,34,56,.18); }
    .option:focus-visible { outline: 4px solid #78C7F2; outline-offset: 4px; }
    .website { background: linear-gradient(115deg, #0B5C93, #167CB8); }
    .whatsapp { background: linear-gradient(115deg, #12824B, #19A45F); }
    .instagram { background: linear-gradient(115deg, #803E9C, #C04E76 60%, #E57A48); }
    .number {
      display: grid; place-items: center; flex: 0 0 42px; height: 42px;
      border: 1px solid rgba(255,255,255,.32); border-radius: 50%;
      background: rgba(255,255,255,.16);
      font-size: 14px; font-weight: 800;
    }
    .option-label { display: grid; gap: 2px; min-width: 0; }
    .option-label strong { font-size: 16px; line-height: 1.25; font-weight: 800; }
    .option-label small { color: rgba(255,255,255,.84); font-size: 12px; line-height: 1.35; }
    .arrow { margin-left: auto; font-size: 26px; line-height: 1; opacity: .9; }
    .footer {
      margin: 24px 0 0; padding-top: 17px; border-top: 1px solid var(--line);
      color: #718397; font-size: 12px;
    }
    .footer a { color: var(--blue); font-weight: 700; text-decoration: none; }
    @media (max-width: 390px) {
      .card { padding: 28px 18px 22px; border-radius: 21px; }
      .logo { width: 250px; margin-bottom: 22px; }
      .option { min-height: 68px; padding: 12px 13px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="assets/img/solvenhub-logo.png" alt="SolvenHub">
    <p class="eyebrow">Welcome to SolvenHub</p>
    <h1>Choose How to Connect</h1>
    <p class="intro">Select one of the options below to reach us.</p>

    <nav class="options" aria-label="SolvenHub contact options">
      <a class="option website" href="https://www.solvenhub.com/" target="_blank" rel="noopener noreferrer">
        <span class="number">01</span>
        <span class="option-label">
          <strong>SolvenHub Website</strong>
          <small>Explore our services and solutions</small>
        </span>
        <span class="arrow" aria-hidden="true">›</span>
      </a>

      <a class="option whatsapp" href="https://wa.me/919326281981?text=Hi%20SolvenHub%2C%20I%27d%20like%20to%20know%20more%20about%20your%20services" target="_blank" rel="noopener noreferrer">
        <span class="number">02</span>
        <span class="option-label">
          <strong>WhatsApp Chat</strong>
          <small>Chat with the SolvenHub team</small>
        </span>
        <span class="arrow" aria-hidden="true">›</span>
      </a>

      <a class="option instagram" href="https://www.instagram.com/solvenhub_security" target="_blank" rel="noopener noreferrer">
        <span class="number">03</span>
        <span class="option-label">
          <strong>SolvenHub Instagram</strong>
          <small>Follow our latest updates</small>
        </span>
        <span class="arrow" aria-hidden="true">›</span>
      </a>
    </nav>

    <p class="footer">SOLVENHUB · <a href="https://www.solvenhub.com/">www.solvenhub.com</a></p>
  </main>
</body>
</html>
